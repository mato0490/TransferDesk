name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package and publish, for example v8.0.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    name: Build release asset (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate release tag
        shell: python
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")

          namespace = {}
          exec(Path("transferdesk_version.py").read_text(encoding="utf-8-sig"), namespace)
          expected = tag[1:]
          actual = namespace.get("__version__")
          if actual != expected:
              raise SystemExit(
                  f"Tag {tag} does not match transferdesk_version.py ({actual})."
              )
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          iconset="assets/transferdesk-icon.iconset"
          rm -rf "$iconset"
          mkdir -p "$iconset"
          sips -z 16 16 assets/transferdesk-icon.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 assets/transferdesk-icon.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 assets/transferdesk-icon.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 assets/transferdesk-icon.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 assets/transferdesk-icon.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 assets/transferdesk-icon.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 assets/transferdesk-icon.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 assets/transferdesk-icon.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 assets/transferdesk-icon.png --out "$iconset/icon_512x512.png"
          sips -z 1024 1024 assets/transferdesk-icon.png --out "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o assets/transferdesk-icon.icns
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean TransferDesk.spec
      - name: Verify packaged network components (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\TransferDesk\TransferDesk.exe" -ArgumentList "--self-test-network" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged network self-test failed with exit code $($process.ExitCode)."
          }
      - name: Sign and verify application bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/TransferDesk.app"
          codesign --verify --deep --strict --verbose=2 "dist/TransferDesk.app"
          "dist/TransferDesk.app/Contents/MacOS/TransferDesk" --self-test-network
      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:RELEASE_TAG}".TrimStart("v")
          $asset = "TransferDesk-windows-v$version.zip"
          Compress-Archive -Path ".\dist\TransferDesk" -DestinationPath $asset -Force
          (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower() + "  $asset" | Set-Content -Encoding ascii "$asset.sha256"
      - name: Package asset (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="TransferDesk-macos-v${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/TransferDesk.app" "$asset"
          shasum -a 256 "$asset" | awk '{print $1 "  " $2}' > "$asset.sha256"
      - name: Upload asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: transferdesk-${{ matrix.platform }}-release-asset
          path: |
            TransferDesk-${{ matrix.platform }}-v*.zip
            TransferDesk-${{ matrix.platform }}-v*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --title "$tag" --generate-notes
          fi
